    </style>
  </head>

    <canvas id="unity-canvas"></canvas>

      var buildUrl = "Build";

        frameworkUrl: buildUrl + "/24199e91a192dd2d9d8592259dac92db.framework.js", // Переменная!

      var canvas = document.querySelector("#unity-canvas");

      createUnityInstance(canvas, config, (progress) => {
        // progress bar logic
      }).then((unityInstance) => {
