<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Unity Web Player | FruitMerge</title>
    <!-- Мета-тег для правильного отображения на всех устройствах -->
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes">
    
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
    <link rel="manifest" href="manifest.webmanifest">
    
    <!-- Стили для полноэкранного режима и правильного масштабирования -->
    <style>
      /* Убираем отступы и делаем тело документа на весь экран */
      html, body {
        padding: 0;
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden; /* Прячем полосы прокрутки */
        background: #1F1F1F; /* Фон для областей, не занятых игрой */
      }
      /* Контейнер теперь занимает все пространство и центрирует содержимое */
      #unity-container {
        width: 100%;
        height: 100%;
        display: flex;
        justify-content: center;
        align-items: center;
      }
      /* Канвас масштабируется, сохраняя пропорции */
      #unity-canvas {
        width: 100%;
        height: 100%;
        /* Это свойство — ключ к успеху. Оно вписывает элемент в контейнер, сохраняя пропорции */
        object-fit: contain; 
      }
      /* Скрываем стандартный футер Unity */
      #unity-footer {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <div id="unity-container">
      <canvas id="unity-canvas" width=1920 height=1080 tabindex="-1"></canvas>
      <div id="unity-loading-bar">
        <div id="unity-logo"></div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>
      <div id="unity-warning"> </div>
    </div>
    <script>
      window.addEventListener("load", function () {
        if ("serviceWorker" in navigator) {
          navigator.serviceWorker.register("ServiceWorker.js");
        }
      });

      var container = document.querySelector("#unity-container");
      var canvas = document.querySelector("#unity-canvas");
      var loadingBar = document.querySelector("#unity-loading-bar");
      var progressBarFull = document.querySelector("#unity-progress-bar-full");
      var warningBanner = document.querySelector("#unity-warning");

      function unityShowBanner(msg, type) {
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
        }
        var div = document.createElement('div');
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type == 'error') div.style = 'background: red; padding: 10px;';
        else {
          if (type == 'warning') div.style = 'background: yellow; padding: 10px;';
          setTimeout(function() {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/534d9e7f00fda601a26d9ed9e9035106.loader.js";
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/efd64f8d51074411fa6bfb52c44f2428.data",
        frameworkUrl: buildUrl + "/122c33e6552190c0e2b888d786eb8b3f.framework.js",
        codeUrl: buildUrl + "/a6696d1728b0f403e7727de18c8895a7.wasm",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "FruitMerge",
        productName: "FruitMerge",
        productVersion: "0.3",
        showBanner: unityShowBanner,
      };

      // Логика для мобильных устройств, которая раньше была здесь, теперь не нужна,
      // так как мета-тег viewport и CSS-стили работают для всех экранов.

      loadingBar.style.display = "block";

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          progressBarFull.style.width = 100 * progress + "%";
        }).then((unityInstance) => {
          loadingBar.style.display = "none";
        }).catch((message) => {
          alert(message);
        });
      };
      document.body.appendChild(script);
    </script>
  </body>
</html>
