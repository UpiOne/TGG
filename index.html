<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>FruitMerge</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
      html, body {
        padding: 0;
        margin: 0;
        width: 100vw;
        height: 100vh;
        overflow: hidden;
        background-color: #222;
      }
      #unity-canvas {
        width: 100%;
        height: 100%;
        background: #231F20;
        display: block;
      }
    </style>
  </head>
  <body>
    <canvas id="unity-canvas"></canvas>
    
    <script>
      // Инициализируем Telegram Web App как можно раньше
      try {
        if (window.Telegram && window.Telegram.WebApp) {
          window.Telegram.WebApp.ready();
          window.Telegram.WebApp.expand();
          Telegram.WebApp.setHeaderColor('#111111');
          Telegram.WebApp.setBackgroundColor('#111111');
        }
      } catch (e) {
        console.error('Telegram WebApp script error:', e);
      }
      
      var canvas = document.querySelector("#unity-canvas");
      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/990d6d1f51afc584f651cdb70918bd0c.loader.js";
      var config = {
        dataUrl: buildUrl + "/24f84b5c42fdea2e4aeb8d465d57bea1.data",
        frameworkUrl: buildUrl + "/24199e91a192dd2d9d8592259dac92db.framework.js",
        codeUrl: buildUrl + "/",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "FruitMerge",
        productName: "FruitMerge",
        productVersion: "0.3",
      };

      // --- ВОТ ГЛАВНОЕ ИЗМЕНЕНИЕ ---
      // 1. Создаем тег <script>
      var script = document.createElement("script");
      script.src = loaderUrl;
      
      // 2. Указываем, что делать ПОСЛЕ того, как скрипт загрузится
      script.onload = () => {
        // Теперь функция createUnityInstance ТОЧНО существует
        createUnityInstance(canvas, config, (progress) => {
          // Тут можно обновлять полосу загрузки
          // console.log(progress * 100 + '%'); 
        }).then((unityInstance) => {
          console.log("Unity instance created successfully.");
          // Можно общаться с Unity отсюда: unityInstance.SendMessage(...)
        }).catch((message) => {
          alert(message);
          console.error(message);
        });
      };
      
      // 3. Добавляем скрипт на страницу, чтобы началась его загрузка
      document.body.appendChild(script);

    </script>
  </body>
</html>
