<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Crypto Casino Game</title>
    <!-- Telegram WebApp Script -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { margin: 0; padding: 0; background: #000; overflow: hidden; }
        #unity-container { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); }
        #unity-canvas { background: #231F20; display: block; }
        #unity-loading-bar { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); display: none; }
        #unity-logo { width: 154px; height: 130px; background: url('unity-logo-dark.png') no-repeat center / contain; }
        #unity-progress-bar-empty { width: 141px; height: 18px; margin-top: 10px; background: url('progress-bar-empty-dark.png') no-repeat center / contain; }
        #unity-progress-bar-full { width: 0%; height: 18px; background: url('progress-bar-full-dark.png') no-repeat center / contain; }
        #unity-footer { position: relative; }
        .unity-footer { position: relative; height: 38px; background: url('webgl-logo.png') no-repeat center / contain; }
        .unity-webgl-logo { float: left; width: 204px; height: 38px; background: url('webgl-logo.png') no-repeat center / contain; }
        .unity-fullscreen-button { float: right; width: 38px; height: 38px; background: url('fullscreen-button.png') no-repeat center / contain; }
    </style>
</head>
<body>
<div id="unity-container" class="unity-desktop">
    <canvas id="unity-canvas" tabindex="-1"></canvas>
    <div id="unity-loading-bar">
        <div id="unity-logo"></div>
        <div id="unity-progress-bar-empty">
            <div id="unity-progress-bar-full"></div>
        </div>
    </div>
    <div id="unity-footer">
        <div class="unity-webgl-logo"></div>
        <div class="unity-fullscreen-button"></div>
    </div>
</div>

<script>
    var container = document.querySelector("#unity-container");
    var canvas = document.querySelector("#unity-canvas");
    var loadingBar = document.querySelector("#unity-loading-bar");
    var progressBarFull = document.querySelector("#unity-progress-bar-full");
    var fullscreenButton = document.querySelector("#unity-fullscreen-button");

    // Показываем индикатор загрузки
    loadingBar.style.display = "block";

    var buildUrl = "Build";
    var loaderUrl = buildUrl + "/Build.loader.js";
    var config = {
        dataUrl: buildUrl + "/Build.data",
        frameworkUrl: buildUrl + "/Build.framework.js",
        codeUrl: buildUrl + "/Build.wasm",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "CryptoCasino",
        productName: "Fruit Merge Game",
        productVersion: "1.0",
    };

    // Создаем загрузчик Unity
    var script = document.createElement("script");
    script.src = loaderUrl;
    script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
            progressBarFull.style.width = 100 * progress + "%";
        }).then((unityInstance) => {
            loadingBar.style.display = "none";
            console.log('Unity загружен успешно');

            // --- ИЗМЕНЕНИЕ 1: Создаем "мост" между страницей и Unity ---
            // Сохраняем экземпляр Unity в глобальную переменную, чтобы jslib мог его найти
            window.MyGameInstance = unityInstance;

            // --- ИЗМЕНЕНИЕ 2: Активно отправляем данные в Unity ---
            // Как только Unity загрузился, сразу отправляем ему initData
            if (window.Telegram && window.Telegram.WebApp) {
                var initData = window.Telegram.WebApp.initData;
                console.log('Отправка initData в Unity:', initData);
                unityInstance.SendMessage('TelegramAuthHandler', 'ReceiveInitData', initData);
            } else {
                console.warn('Telegram WebApp не найден. Отправка пустых данных в Unity.');
                unityInstance.SendMessage('TelegramAuthHandler', 'ReceiveInitData', '');
            }

        }).catch((message) => {
            alert(message);
        });
    };
    document.body.appendChild(script);
</script>
</body>
</html>
