<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    
    <!-- =================================================================== -->
    <!-- ДОБАВЛЕНА СТРОКА ДЛЯ ИНТЕГРАЦИИ С TELEGRAM -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- =================================================================== -->

    <title>Unity Web Player | FruitMerge</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
    <link rel="manifest" href="manifest.webmanifest">
  </head>
  <body>
    <div id="unity-container">
      <canvas id="unity-canvas" width=1920 height=1080 tabindex="-1"></canvas>
      <div id="unity-loading-bar">
        <div id="unity-logo"></div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>
      <div id="unity-warning"> </div>
    </div>
    <script>
      window.addEventListener("load", function () {
        if ("serviceWorker" in navigator) {
          navigator.serviceWorker.register("ServiceWorker.js");
        }
      });

      var container = document.querySelector("#unity-container");
      var canvas = document.querySelector("#unity-canvas");
      var loadingBar = document.querySelector("#unity-loading-bar");
      var progressBarFull = document.querySelector("#unity-progress-bar-full");
      var warningBanner = document.querySelector("#unity-warning");

      function unityShowBanner(msg, type) {
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
        }
        var div = document.createElement('div');
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type == 'error') div.style = 'background: red; padding: 10px;';
        else {
          if (type == 'warning') div.style = 'background: yellow; padding: 10px;';
          setTimeout(function() {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/ba48589658bcabc68bdc1781a875d1eb.loader.js";
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/3b524a25720ccc448bde1d3d51159a39.data",
        frameworkUrl: buildUrl + "/87c86ebd01c8abef48bd786a5360d669.framework.js", // Взят ваш новый frameworkUrl
        codeUrl: buildUrl + "/8f9fcebd9d3c6bf73ea2be4cf8be8ce4.wasm",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "FruitMerge",
        productName: "FruitMerge",
        productVersion: "0.3",
        showBanner: unityShowBanner,
      };

      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        var meta = document.createElement('meta');
        meta.name = 'viewport';
        meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
        document.getElementsByTagName('head')[0].appendChild(meta);
      }

      loadingBar.style.display = "block";

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          progressBarFull.style.width = 100 * progress + "%";
        }).then((unityInstance) => {
          // ===================================================================
          // ЭТА ЧАСТЬ БЫЛА ВОССТАНОВЛЕНА. ОНА КРИТИЧЕСКИ ВАЖНА
          // ===================================================================
          
          // Сохраняем unityInstance в глобальной области видимости,
          // чтобы jslib мог отправлять в C# сообщения
          window.unityInstance = unityInstance;
          loadingBar.style.display = "none";

          // Отладочная информация, чтобы проверить, загрузился ли скрипт Telegram
          console.log('=== TELEGRAM DEBUG INFO ===');
          console.log('window.Telegram:', window.Telegram);
          console.log('window.Telegram.WebApp:', window.Telegram?.WebApp);
          console.log('==========================');
          // ===================================================================
          // КОНЕЦ ВОССТАНОВЛЕННОГО БЛОКА
          // ===================================================================

        }).catch((message) => {
          alert(message);
        });
      };
      document.body.appendChild(script);
    </script>
  </body>
</html>
